name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          {
            POSTGRES_USER: staybangla,
            POSTGRES_PASSWORD: staybangla,
            POSTGRES_DB: staybangla,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U staybangla" --health-interval 5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://staybangla:staybangla@localhost:5432/staybangla?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - name: "Start MinIO (GHA services block can't override the container command, so run it directly)"
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=staybangla \
            -e MINIO_ROOT_PASSWORD=staybangla-secret \
            minio/minio:latest server /data --console-address ":9001"
      - name: Wait for MinIO to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/ready; then
              echo "MinIO is ready"
              exit 0
            fi
            echo "Waiting for MinIO... ($i)"
            sleep 2
          done
          echo "MinIO did not become ready in time" >&2
          docker logs minio || true
          exit 1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @staybangla/api exec prisma generate
      - run: pnpm --filter @staybangla/api exec prisma migrate deploy
      - name: Create dedicated e2e test database
        run: PGPASSWORD=staybangla psql -h localhost -U staybangla -d staybangla -c "CREATE DATABASE staybangla_test;"
      - name: Generate ephemeral apps/api/.env.test for e2e tests
        run: |
          cat > apps/api/.env.test <<'EOF'
          DATABASE_URL=postgresql://staybangla:staybangla@localhost:5432/staybangla_test?schema=public
          REDIS_URL=redis://localhost:6379
          API_PORT=3001
          JWT_ACCESS_SECRET=ci-only-access-secret-32-characters-min
          JWT_ACCESS_EXPIRES_IN=15m
          JWT_REFRESH_SECRET=ci-only-refresh-secret-32-characters-min
          JWT_REFRESH_EXPIRES_IN=30d
          OTP_TTL_SECONDS=300
          OTP_MAX_ATTEMPTS=5
          OTP_RESEND_COOLDOWN_SECONDS=60
          OTP_RATE_LIMIT_PER_IDENTIFIER_PER_HOUR=5
          OTP_RATE_LIMIT_PER_IP_PER_HOUR=10
          OTP_PEPPER=ci-only-otp-pepper
          ARGON2_MEMORY_COST_KIB=8192
          ARGON2_TIME_COST=2
          MINIO_ENDPOINT=127.0.0.1
          MINIO_PORT=9000
          MINIO_USE_SSL=false
          MINIO_ACCESS_KEY=staybangla
          MINIO_SECRET_KEY=staybangla-secret
          MINIO_BUCKET=staybangla-photos
          SSLCOMMERZ_STORE_ID=ci-test-store-id
          SSLCOMMERZ_STORE_PASSWORD=ci-test-store-password
          SSLCOMMERZ_SANDBOX=true
          FRONTEND_URL=http://localhost:3000
          API_BASE_URL=http://localhost:3001
          EOF
      - run: pnpm --filter @staybangla/api exec dotenv -e .env.test -- prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
