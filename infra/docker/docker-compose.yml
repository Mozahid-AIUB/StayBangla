# Explicit project name so all containers/volumes/network are namespaced under
# "staybangla" (staybangla-postgres-1, staybangla_pgdata, ...) — never colliding
# with any other project on this machine.
name: staybangla

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: staybangla
      POSTGRES_PASSWORD: staybangla
      POSTGRES_DB: staybangla
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staybangla"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Host port 6380 to avoid clashing with other local Redis instances;
    # container port stays 6379. Local REDIS_URL uses 127.0.0.1:6380.
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: staybangla
      MINIO_ROOT_PASSWORD: staybangla-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  miniodata:
